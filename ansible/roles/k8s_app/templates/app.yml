apiVersion: v1
kind: Service
metadata:
  name: crudwithauth
spec:
  type: NodePort
  selector:
    app: crudwithauth
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appsettings
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Microsoft.EntityFrameworkCore.Database.Command": "Warning",
          "Microsoft.EntityFrameworkCore": "Warning",
          "StackExchange.Redis": "Warning"
        }
      },
      "AllowedHosts": "*",
      "ConnectionStrings": {
        "DefaultConnection": "Host=postgres;Port=5432;Database={{ db_name }};Username={{ db_user }};Password={{ db_password }}"
      },
      "Redis": {
        "InstanceName": "CrudWithAuth:",
        "Endpoints": ["redis:7000"]
      },
      "Jwt": {
        "SecretKey": "{{ jwt_secret_key }}",
        "Issuer": "CrudWithAuth",
        "Audience": "CrudWithAuth",
        "AccessTokenExpirationMinutes": 60,
        "RefreshTokenExpirationDays": 7
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crudwithauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crudwithauth
  template:
    metadata:
      labels:
        app: crudwithauth
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.m.daocloud.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 3;
              done
              echo "Postgres is ready."
        - name: wait-for-redis
          image: docker.m.daocloud.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 7000; do
                echo "Waiting for redis..."; sleep 3;
              done
              echo "Redis is ready."
      containers:
        - name: crudwithauth
          image: crudwithauth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          volumeMounts:
            - name: appsettings-volume
              mountPath: /app/appsettings.json
              subPath: appsettings.json
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: appsettings-volume
          configMap:
            name: appsettings
